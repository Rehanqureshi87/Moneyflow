<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070907">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Smart Money Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#070907;--card:#101410;--card2:#171d17;--line:#232c23;--text:#eef5ee;--mute:#8a978a;--g:#22e07a;--g2:#0e9f52;--red:#ff6b6b;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:460px;margin:0 auto;padding:18px 16px 170px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.month{font-size:13px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.hi{font-size:22px;font-weight:700;margin-top:2px}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:9px 13px;font:inherit;font-size:13px;cursor:pointer}
.hero{background:radial-gradient(120% 140% at 100% 0%,#0f3d24 0%,#0b1a11 55%,#0a0f0b 100%);border:1px solid #1d3a28;border-radius:24px;padding:22px 20px;margin-bottom:14px}
.hero small{color:#9fc4ad;font-size:13px}
.big{font-size:42px;font-weight:700;letter-spacing:-.02em;margin:4px 0 16px;color:var(--g)}
.big.neg{color:var(--red)}
.bar{height:10px;background:#0a120c;border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g));border-radius:10px;transition:width .4s}
.bar i.warn{background:linear-gradient(90deg,#d9a21b,#ffd04d)}
.bar i.bad{background:linear-gradient(90deg,#c43d3d,var(--red))}
.stats{display:flex;justify-content:space-between;margin-top:12px;font-size:13px;color:#9fc4ad}
.stats b{color:var(--text);font-weight:600}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sec h3{margin:0;font-size:15px;font-weight:600}
.sec span{font-size:12px;color:var(--mute)}
.insight{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:13px;color:#c9d8c9;line-height:1.45}
.row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.row .l{width:92px;font-size:13px}
.row .t{flex:1;height:8px;background:var(--card2);border-radius:8px;overflow:hidden}
.row .t i{display:block;height:100%;background:var(--g);border-radius:8px}
.row .a{width:64px;text-align:right;font-size:13px;font-weight:600}
.tx{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.em{width:40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:19px;flex:none}
.tx .m{flex:1;min-width:0}
.tx .m b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .m span{font-size:12px;color:var(--mute)}
.tx .p{font-weight:700;font-size:15px}
.x{background:none;border:0;color:#586458;font-size:15px;padding:6px;cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:26px 0;font-size:14px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:linear-gradient(135deg,var(--g),var(--g2));color:#04140a;border:0;border-radius:40px;padding:17px 30px;font:inherit;font-size:16px;font-weight:700;box-shadow:0 10px 30px rgba(34,224,122,.35);cursor:pointer;z-index:5}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;background:#0d120d;border:1px solid var(--line);border-radius:26px 26px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s;z-index:11}
.sheet.on{transform:none}
.grab{width:42px;height:4px;background:#2c372c;border-radius:4px;margin:0 auto 14px}
.sheet h2{margin:0 0 12px;font-size:18px}
.amt{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 16px}
.amt span{font-size:30px;color:var(--g);font-weight:700;margin-right:8px}
.amt input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:34px;font-weight:700;padding:8px 0}
.quick{display:flex;gap:8px;margin:10px 0 14px;overflow-x:auto}
.quick button{flex:none;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:20px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.cats button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:10px 4px;font:inherit;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.cats button em{font-style:normal;font-size:20px}
.cats button.on{border-color:var(--g);background:#0f2a1a;color:var(--g)}
.note{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--text);font:inherit;font-size:14px;outline:0;margin-bottom:14px}
.save{width:100%;background:linear-gradient(135deg,var(--g),var(--g2));color:#04140a;border:0;border-radius:16px;padding:16px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.save:disabled{opacity:.35}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;display:flex;background:#0b0f0b;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
.nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;cursor:pointer}
.nav button em{font-style:normal;font-size:20px}
.nav button.on{color:var(--g)}
.hm{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;cursor:pointer}
.hm .h1{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.hm .h1 b{font-size:15px}
.hm .sv{font-weight:700;font-size:15px;color:var(--g)}
.hm .sv.neg{color:var(--red)}
.hm .meta{font-size:12px;color:var(--mute);margin:4px 0 10px}
.hm .det{display:none;margin-top:14px}
.hm.open .det{display:block}
</style>
</head>
<body>
<div class="app" id="app"></div>
<button class="fab" id="fab">＋ Expense Add Karo</button>
<div class="nav"><button data-v="home" class="on"><em>🏠</em>Home</button><button data-v="hist"><em>📅</em>History</button></div>
<div class="ov" id="ov"></div>
<div class="sheet" id="addSheet"></div>
<div class="sheet" id="salSheet"></div>

<script>
var CATS=[["food","🍔","Food"],["transport","🚗","Travel"],["shopping","🛍️","Shopping"],["bills","💡","Bills"],["fun","🎬","Fun"],["health","💊","Health"],["study","📚","Study"],["other","📦","Other"]];
var $=function(s){return document.querySelector(s)};
var d0=new Date(),KEY="mt:"+d0.getFullYear()+"-"+String(d0.getMonth()+1).padStart(2,"0");
var S={salary:0,tx:[]},pick="food";
function load(){try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));if(S.salary)localStorage.setItem("mt:last",String(S.salary))}catch(e){}}
function fmt(n){return "₹"+Number(n).toLocaleString("en-IN",{maximumFractionDigits:0})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cat(id){return CATS.filter(function(c){return c[0]===id})[0]||CATS[7]}

function renderHome(){
  var spent=S.tx.reduce(function(a,t){return a+t.amt},0),left=S.salary-spent;
  var pct=S.salary?Math.min(spent/S.salary*100,100):0;
  var tot={};S.tx.forEach(function(t){tot[t.cat]=(tot[t.cat]||0)+t.amt});
  var ids=Object.keys(tot).sort(function(a,b){return tot[b]-tot[a]});
  var month=d0.toLocaleString("en-IN",{month:"long",year:"numeric"});
  var h='<div class="top"><div><div class="month">'+month+'</div><div class="hi">Hey Rehan 👋</div></div><button class="iconbtn" id="editSal">Salary ✎</button></div>';
  h+='<div class="hero"><small>Bacha hua balance</small><div class="big'+(left<0?' neg':'')+'">'+(left<0?'-':'')+fmt(Math.abs(left))+'</div>';
  h+='<div class="bar"><i class="'+(pct>90?'bad':pct>70?'warn':'')+'" style="width:'+pct+'%"></i></div>';
  h+='<div class="stats"><span>Spent <b>'+fmt(spent)+'</b></span><span>'+Math.round(pct)+'% used</span><span>Salary <b>'+fmt(S.salary)+'</b></span></div></div>';
  if(ids.length){
    var top=cat(ids[0]);
    h+='<div class="insight">💡 Sabse zyada kharch <b>'+top[1]+' '+top[2]+'</b> pe hua: '+fmt(tot[ids[0]])+'.'+(left<0?' Budget cross ho gaya, thoda control karo 😅':'')+'</div>';
    h+='<div class="sec"><h3>Kahan gaya paisa</h3></div>';
    ids.forEach(function(id){var c=cat(id);h+='<div class="row"><div class="l">'+c[1]+' '+c[2]+'</div><div class="t"><i style="width:'+(tot[id]/spent*100)+'%"></i></div><div class="a">'+fmt(tot[id])+'</div></div>'});
  }
  h+='<div class="sec"><h3>Recent</h3><span>'+S.tx.length+' entries</span></div>';
  if(!S.tx.length)h+='<div class="empty">Abhi koi expense nahi. Neeche button se add karo 🙌</div>';
  S.tx.slice().reverse().forEach(function(t){
    var c=cat(t.cat),dt=new Date(t.ts).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
    h+='<div class="tx"><div class="em">'+c[1]+'</div><div class="m"><b>'+esc(t.note||c[2])+'</b><span>'+c[2]+' · '+dt+'</span></div><div class="p">-'+fmt(t.amt)+'</div><button class="x" data-id="'+t.id+'">✕</button></div>';
  });
  $("#app").innerHTML=h;
  $("#editSal").onclick=openSal;
  Array.prototype.forEach.call(document.querySelectorAll(".x"),function(b){b.onclick=function(){S.tx=S.tx.filter(function(t){return String(t.id)!==b.getAttribute("data-id")});save();render()}});
}

function show(sheet){$("#ov").classList.add("on");sheet.classList.add("on")}
function hide(){$("#ov").classList.remove("on");$("#addSheet").classList.remove("on");$("#salSheet").classList.remove("on")}
$("#ov").onclick=hide;

function openAdd(){
  var h='<div class="grab"></div><h2>Quick Add</h2><div class="amt"><span>₹</span><input id="amtIn" type="number" inputmode="decimal" placeholder="0"></div>';
  h+='<div class="quick">'+[20,50,100,200,500,1000].map(function(n){return '<button data-q="'+n+'">+'+n+'</button>'}).join("")+'</div>';
  h+='<div class="cats">'+CATS.map(function(c){return '<button data-c="'+c[0]+'" class="'+(c[0]===pick?'on':'')+'"><em>'+c[1]+'</em>'+c[2]+'</button>'}).join("")+'</div>';
  h+='<input class="note" id="noteIn" placeholder="Note (optional): Zomato, petrol..."><button class="save" id="saveBtn" disabled>Save Expense</button>';
  var s=$("#addSheet");s.innerHTML=h;show(s);
  var inp=$("#amtIn"),btn=$("#saveBtn");
  inp.oninput=function(){btn.disabled=!(Number(inp.value)>0)};
  Array.prototype.forEach.call(s.querySelectorAll("[data-q]"),function(b){b.onclick=function(){inp.value=(Number(inp.value)||0)+Number(b.getAttribute("data-q"));inp.oninput()}});
  Array.prototype.forEach.call(s.querySelectorAll("[data-c]"),function(b){b.onclick=function(){pick=b.getAttribute("data-c");Array.prototype.forEach.call(s.querySelectorAll("[data-c]"),function(x){x.classList.toggle("on",x===b)})}});
  btn.onclick=function(){var a=Number(inp.value);if(!(a>0))return;S.tx.push({id:Date.now(),amt:a,cat:pick,note:$("#noteIn").value.trim(),ts:Date.now()});save();hide();render()};
  setTimeout(function(){inp.focus()},300);
}
function openSal(){
  var last="";try{last=localStorage.getItem("mt:last")||""}catch(e){}
  var h='<div class="grab"></div><h2>Is mahine ki salary</h2><div class="amt"><span>₹</span><input id="salIn" type="number" inputmode="decimal" placeholder="0" value="'+(S.salary||last)+'"></div><div style="height:14px"></div><button class="save" id="salBtn">Set Salary</button>';
  var s=$("#salSheet");s.innerHTML=h;show(s);
  $("#salBtn").onclick=function(){var v=Number($("#salIn").value);if(!(v>0))return;S.salary=v;save();hide();render()};
}
var view="home";
function render(){
  $("#fab").style.display=view==="home"?"":"none";
  Array.prototype.forEach.call(document.querySelectorAll(".nav button"),function(b){b.classList.toggle("on",b.getAttribute("data-v")===view)});
  if(view==="home")renderHome();else renderHist();
}
function mlabel(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,1).toLocaleString("en-IN",{month:"long",year:"numeric"})}
function months(){var out=[];try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^mt:\d{4}-\d{2}$/.test(k)){var o=JSON.parse(localStorage.getItem(k));o.tx=o.tx||[];out.push({k:k.slice(3),d:o})}}}catch(e){}out.sort(function(a,b){return a.k<b.k?1:-1});return out}
function renderHist(){
  var ms=months(),tS=0,best=null;
  ms.forEach(function(m){m.sp=m.d.tx.reduce(function(a,t){return a+t.amt},0);m.sv=(m.d.salary||0)-m.sp;if(m.d.salary>0){tS+=m.sv;if(!best||m.sv>best.sv)best=m}});
  var h='<div class="top"><div><div class="month">Month-wise</div><div class="hi">History 📅</div></div></div>';
  h+='<div class="hero"><small>Total saved ('+ms.length+(ms.length===1?' month)':' months)')+'</small><div class="big'+(tS<0?' neg':'')+'">'+(tS<0?'-':'')+fmt(Math.abs(tS))+'</div>';
  if(best)h+='<div class="stats"><span>🏆 Best month: <b>'+mlabel(best.k)+'</b> ('+fmt(best.sv)+')</span></div>';
  h+='</div>';
  if(!ms.length)h+='<div class="empty">Abhi koi history nahi 🙌</div>';
  ms.forEach(function(m){
    var sal=m.d.salary||0,pct=sal?Math.min(m.sp/sal*100,100):0,tot={};
    m.d.tx.forEach(function(t){tot[t.cat]=(tot[t.cat]||0)+t.amt});
    var ids=Object.keys(tot).sort(function(a,b){return tot[b]-tot[a]});
    h+='<div class="hm"><div class="h1"><b>'+mlabel(m.k)+'</b><span class="sv'+(m.sv<0?' neg':'')+'">'+(m.sv<0?'-':'+')+fmt(Math.abs(m.sv))+'</span></div>';
    h+='<div class="meta">Salary '+fmt(sal)+' · Spent '+fmt(m.sp)+' · '+m.d.tx.length+' entries</div><div class="bar"><i class="'+(pct>90?'bad':pct>70?'warn':'')+'" style="width:'+pct+'%"></i></div><div class="det">';
    if(!ids.length)h+='<div class="meta">Is mahine koi expense nahi</div>';
    ids.forEach(function(id){var c=cat(id);h+='<div class="row"><div class="l">'+c[1]+' '+c[2]+'</div><div class="t"><i style="width:'+(tot[id]/m.sp*100)+'%"></i></div><div class="a">'+fmt(tot[id])+'</div></div>'});
    h+='</div></div>';
  });
  $("#app").innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll(".hm"),function(c){c.onclick=function(){c.classList.toggle("open")}});
}
Array.prototype.forEach.call(document.querySelectorAll(".nav button"),function(b){b.onclick=function(){view=b.getAttribute("data-v");window.scrollTo(0,0);render()}});
$("#fab").onclick=openAdd;
load();render();if(!S.salary)openSal();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
